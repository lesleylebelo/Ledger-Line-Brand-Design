<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wireframe — Homepage (Desktop)</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0; font-family:Arial, sans-serif; background:#fff; color:#000;}
  .box{border:1.5px solid #000;}
  .lbl{position:absolute; top:6px; left:8px; font-size:10px; color:#666; text-transform:uppercase; letter-spacing:0.5px;}
  .ph-line{background:#ccc; height:10px; margin-bottom:8px;}
  .ph-block{background:#e2e2e2;}
  section{position:relative; padding:24px 40px; border-bottom:1.5px solid #000;}

  nav{display:flex; justify-content:space-between; align-items:center; padding:16px 40px; border-bottom:1.5px solid #000;}
  .nav-logo{width:110px; height:20px; background:#000;}
  .nav-links{display:flex; gap:20px;}
  .nav-links div{width:60px; height:12px; background:#ccc;}
  .nav-cta{width:100px; height:32px; border:1.5px solid #000;}

  .hero{display:flex; gap:40px; align-items:center; padding-top:60px; padding-bottom:60px;}
  .hero-copy{flex:1;}
  .hero-h{width:90%; height:30px; background:#999; margin-bottom:10px;}
  .hero-h2{width:70%; height:30px; background:#999; margin-bottom:20px;}
  .hero-p{width:80%; height:12px; background:#ccc; margin-bottom:8px;}
  .hero-ctas{display:flex; gap:14px; margin-top:20px;}
  .btn-solid{width:130px; height:40px; background:#000;}
  .btn-outline{width:130px; height:40px; border:1.5px solid #000;}
  .hero-visual{flex:1; height:280px; background:#ddd; border:1.5px dashed #999;}

  .benefits-row{display:flex; gap:20px; margin-top:20px;}
  .benefit-card{flex:1; height:120px; border:1.5px solid #000; padding:12px;}

  .features-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:20px;}
  .feature-card{height:100px; border:1.5px solid #000;}

  .industries-row{display:flex; gap:12px; margin-top:16px; flex-wrap:wrap;}
  .pill{width:100px; height:28px; border:1.5px solid #000;}

  .proof-band{display:flex; gap:20px; background:#eee; padding:24px 40px; margin:0 -40px;}
  .proof-item{flex:1;}
  .proof-num{width:40px; height:26px; background:#999; margin-bottom:6px;}
  .proof-cap{width:80%; height:10px; background:#ccc;}

  .testimonial{height:110px; border:1.5px solid #000; margin-top:10px;}

  .cta-band{display:flex; justify-content:space-between; align-items:center; background:#000; color:#fff; padding:32px 40px;}
  .cta-band .ph-line{background:#666;}
  .cta-btn{width:140px; height:44px; background:#fff;}

  footer{display:flex; justify-content:space-between; padding:30px 40px; font-size:10px; color:#666;}
  .foot-col{width:100px;}
  .foot-line{width:80%; height:8px; background:#ccc; margin-bottom:6px;}

  @media (max-width:480px){
    nav{padding:14px 20px;}
    section{padding:18px 20px;}
    .nav-links{display:none;}
    .hero{flex-direction:column; padding-top:20px; padding-bottom:20px;}
    .hero-copy, .hero-visual{width:100%;}
    .hero-visual{height:160px;}
    .benefits-row{flex-direction:column;}
    .features-grid{grid-template-columns:1fr 1fr;}
    .proof-band{flex-direction:column; gap:14px; padding:20px;}
    .cta-band{flex-direction:column; align-items:flex-start; gap:16px; padding:24px 20px;}
    footer{flex-direction:column; gap:16px; padding:20px;}
  }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo"></div>
  <div class="nav-links"><div></div><div></div><div></div></div>
  <div class="nav-cta"></div>
</nav>

<section>
  <div class="lbl">Hero</div>
  <div class="hero">
    <div class="hero-copy">
      <div class="hero-h"></div>
      <div class="hero-h2" style="width:50%;"></div>
      <div class="hero-p"></div>
      <div class="hero-p" style="width:60%;"></div>
      <div class="hero-ctas">
        <div class="btn-solid"></div>
        <div class="btn-outline"></div>
      </div>
    </div>
    <div class="hero-visual"></div>
  </div>
</section>

<section>
  <div class="lbl">Product intro</div>
  <div class="hero-h2" style="width:60%; margin-top:24px;"></div>
  <div class="hero-p" style="width:70%;"></div>
  <div class="hero-p" style="width:55%;"></div>
</section>

<section>
  <div class="lbl">Key benefits</div>
  <div class="benefits-row" style="margin-top:24px;">
    <div class="benefit-card"></div>
    <div class="benefit-card"></div>
    <div class="benefit-card"></div>
  </div>
</section>

<section>
  <div class="lbl">Features</div>
  <div class="features-grid">
    <div class="feature-card"></div>
    <div class="feature-card"></div>
    <div class="feature-card"></div>
    <div class="feature-card"></div>
    <div class="feature-card"></div>
    <div class="feature-card"></div>
  </div>
</section>

<section>
  <div class="lbl">Industries served</div>
  <div class="industries-row">
    <div class="pill"></div><div class="pill"></div><div class="pill"></div><div class="pill"></div><div class="pill"></div>
  </div>
</section>

<section style="padding:0;">
  <div class="proof-band">
    <div class="proof-item"><div class="proof-num"></div><div class="proof-cap"></div></div>
    <div class="proof-item"><div class="proof-num"></div><div class="proof-cap"></div></div>
    <div class="proof-item"><div class="proof-num"></div><div class="proof-cap"></div></div>
  </div>
</section>

<section>
  <div class="lbl">Testimonial</div>
  <div class="testimonial" style="margin-top:20px;"></div>
</section>

<section style="padding:0; border-bottom:none;">
  <div class="cta-band">
    <div>
      <div class="ph-line" style="width:220px;"></div>
      <div class="ph-line" style="width:160px;"></div>
    </div>
    <div class="cta-btn"></div>
  </div>
</section>

<footer>
  <div class="foot-col"><div class="foot-line"></div><div class="foot-line"></div><div class="foot-line"></div></div>
  <div class="foot-col"><div class="foot-line"></div><div class="foot-line"></div></div>
  <div class="foot-col"><div class="foot-line"></div><div class="foot-line"></div></div>
  <div class="foot-col"><div class="foot-line"></div></div>
</footer>

</body>
</html>
