<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap');
      .display{font-family:'Space Grotesk','Carlito',sans-serif;}
      .mono{font-family:'IBM Plex Mono','DejaVu Sans Mono',monospace;}
    </style>
  </defs>
  <rect width="960" height="460" fill="#F3F4F1"/>

  <!-- Home node -->
  <rect x="400" y="24" width="160" height="56" rx="4" fill="#17233F"/>
  <text x="480" y="58" text-anchor="middle" class="display" font-size="16" font-weight="600" fill="#F3F4F1">Home</text>

  <!-- connector lines from home down to a horizontal bus -->
  <line x1="480" y1="80" x2="480" y2="120" stroke="#ADB4C0" stroke-width="2"/>
  <line x1="120" y1="120" x2="840" y2="120" stroke="#ADB4C0" stroke-width="2"/>
  <line x1="120" y1="120" x2="120" y2="150" stroke="#ADB4C0" stroke-width="2"/>
  <line x1="360" y1="120" x2="360" y2="150" stroke="#ADB4C0" stroke-width="2"/>
  <line x1="600" y1="120" x2="600" y2="150" stroke="#ADB4C0" stroke-width="2"/>
  <line x1="840" y1="120" x2="840" y2="150" stroke="#ADB4C0" stroke-width="2"/>

  <!-- level 2 nodes -->
  <g>
    <rect x="40" y="150" width="160" height="50" rx="4" fill="#FFFFFF" stroke="#2E3F63" stroke-width="1.5"/>
    <text x="120" y="181" text-anchor="middle" class="display" font-size="14" font-weight="500" fill="#17233F">Solutions</text>
  </g>
  <g>
    <rect x="280" y="150" width="160" height="50" rx="4" fill="#FFFFFF" stroke="#2E3F63" stroke-width="1.5"/>
    <text x="360" y="181" text-anchor="middle" class="display" font-size="14" font-weight="500" fill="#17233F">About</text>
  </g>
  <g>
    <rect x="520" y="150" width="160" height="50" rx="4" fill="#FFFFFF" stroke="#2E3F63" stroke-width="1.5"/>
    <text x="600" y="181" text-anchor="middle" class="display" font-size="14" font-weight="500" fill="#17233F">Resources</text>
  </g>
  <g>
    <rect x="760" y="150" width="160" height="50" rx="4" fill="#E2A339"/>
    <text x="840" y="181" text-anchor="middle" class="display" font-size="14" font-weight="600" fill="#17233F">Contact / Demo</text>
  </g>

  <!-- level 3 — solutions children -->
  <line x1="120" y1="200" x2="120" y2="230" stroke="#DFE2E7" stroke-width="2"/>
  <line x1="60" y1="230" x2="180" y2="230" stroke="#DFE2E7" stroke-width="2"/>
  <line x1="60" y1="230" x2="60" y2="255" stroke="#DFE2E7" stroke-width="2"/>
  <line x1="120" y1="230" x2="120" y2="255" stroke="#DFE2E7" stroke-width="2"/>
  <line x1="180" y1="230" x2="180" y2="255" stroke="#DFE2E7" stroke-width="2"/>

  <rect x="16" y="255" width="88" height="40" rx="3" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.5"/>
  <text x="60" y="279" text-anchor="middle" class="mono" font-size="10.5" fill="#2E3F63">Wholesale</text>
  <rect x="76" y="255" width="88" height="40" rx="3" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.5"/>
  <text x="120" y="279" text-anchor="middle" class="mono" font-size="10.5" fill="#2E3F63">Distribution</text>
  <rect x="136" y="255" width="88" height="40" rx="3" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.5"/>
  <text x="180" y="279" text-anchor="middle" class="mono" font-size="10.5" fill="#2E3F63">Retail</text>

  <!-- level 3 - resources children -->
  <line x1="600" y1="200" x2="600" y2="230" stroke="#DFE2E7" stroke-width="2"/>
  <line x1="560" y1="230" x2="640" y2="230" stroke="#DFE2E7" stroke-width="2"/>
  <line x1="560" y1="230" x2="560" y2="255" stroke="#DFE2E7" stroke-width="2"/>
  <line x1="640" y1="230" x2="640" y2="255" stroke="#DFE2E7" stroke-width="2"/>
  <rect x="516" y="255" width="88" height="40" rx="3" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.5"/>
  <text x="560" y="279" text-anchor="middle" class="mono" font-size="10.5" fill="#2E3F63">Guides</text>
  <rect x="596" y="255" width="88" height="40" rx="3" fill="#FFFFFF" stroke="#DFE2E7" stroke-width="1.5"/>
  <text x="640" y="279" text-anchor="middle" class="mono" font-size="10.5" fill="#2E3F63">Blog</text>

  <!-- legend / notes -->
  <rect x="40" y="340" width="880" height="90" fill="#FFFFFF" style="stroke:#DFE2E7; stroke-width:1;"/>
  <text x="64" y="368" class="display" font-size="13" font-weight="600" fill="#17233F">Structure notes</text>
  <text x="64" y="392" class="mono" font-size="11.5" fill="#2E3F63">Flat, 3 levels deep maximum — a buyer should reach any page in 2 clicks from Home.</text>
  <text x="64" y="412" class="mono" font-size="11.5" fill="#2E3F63">"Contact / Demo" (amber) is reachable from the primary nav on every page, not only from Home.</text>

</svg>
