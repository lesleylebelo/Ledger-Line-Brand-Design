<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap');
      .display{font-family:'Space Grotesk', sans-serif;}
      .text{font-family:'IBM Plex Sans', sans-serif;}
    </style>
  </defs>

  <rect width="1080" height="1080" fill="#17233F"/>

  <!-- oversized ledger-line motif, subtle, background right -->
  <g opacity="0.5" transform="translate(560,120)">
    <polyline points="0,120 260,120" fill="none" stroke="#2E3F63" stroke-width="16" stroke-linecap="round"/>
    <polyline points="0,220 340,220" fill="none" stroke="#2E3F63" stroke-width="16" stroke-linecap="round"/>
    <polyline points="0,320 260,320 400,150" fill="none" stroke="#E2A339" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- logo mark, small, top -->
  <g transform="translate(80,80)">
    <polyline points="0,10 22,10" fill="none" stroke="#7E8CAE" stroke-width="4" stroke-linecap="round"/>
    <polyline points="0,20 28,20" fill="none" stroke="#B7BFD3" stroke-width="4" stroke-linecap="round"/>
    <polyline points="0,30 22,30 32,17" fill="none" stroke="#E2A339" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="27" class="display" font-size="22" font-weight="500" fill="#F3F4F1">ledgerline</text>
  </g>

  <!-- headline -->
  <text x="80" y="620" class="display" font-size="76" font-weight="600" fill="#F3F4F1">Every line</text>
  <text x="80" y="710" class="display" font-size="76" font-weight="600" fill="#E2A339">adds up.</text>

  <!-- subhead -->
  <text x="80" y="780" class="text" font-size="27" fill="#C6CCDD">Stock, orders, pricing and people —</text>
  <text x="80" y="818" class="text" font-size="27" fill="#C6CCDD">finally in one place.</text>

  <!-- CTA -->
  <g transform="translate(80,900)">
    <rect width="220" height="60" rx="4" fill="#E2A339"/>
    <text x="110" y="38" text-anchor="middle" class="text" font-size="18" font-weight="500" fill="#17233F">Book a demo</text>
  </g>
</svg>
